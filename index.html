<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087d80"><title>파인애플의 전설 | 다국어 오디오북</title><meta name="description" content="필리핀어·영어·몽골어·스페인어와 한국어로 듣는 파인애플의 전설. 책, 소리, 자막 중 원하는 방법으로 감상하세요."><meta property="og:title" content="다국어 오디오북 | 파인애플의 전설"><meta property="og:description" content="QR코드를 스캔하고 네 가지 언어로 감상해 보세요! Scan & Listen!"><meta property="og:image" content="https://seojisub.github.io/pineapple/tl-cover.jpg"><meta property="og:url" content="https://seojisub.github.io/pineapple/"><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍍%3C/text%3E%3C/svg%3E">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#173b39;background:#faf7ef;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:40px 24px 64px}header{margin-bottom:32px}.eyebrow{font-size:13px;letter-spacing:.08em;color:#087d80;font-weight:700}h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.05em;line-height:1.25;margin:12px 0}h2{font-size:25px;line-height:1.4;margin:0 0 6px}p{margin:8px 0 16px}.intro{color:#556b66}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}a{color:#087d80}.card{display:block;background:white;border:1px solid #dce5dc;border-radius:22px;overflow:hidden;text-decoration:none;box-shadow:0 5px 15px #173b3906;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #173b3914}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f6f3e9}.card div{padding:18px 20px}.card strong{font-size:21px;color:#173b39;display:block}.card span{font-size:14px;color:#6a7971}.card small{display:block;color:#087d80;margin-top:10px;font-weight:700}.back{display:inline-block;margin-bottom:20px;text-decoration:none;font-size:15px}.panel{background:white;border:1px solid #dce5dc;border-radius:24px;padding:28px}.modes{display:grid;gap:12px;margin-top:24px}.mode{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid #d8e4da;border-radius:16px;text-decoration:none;color:#173b39;background:#fff}.mode:hover{background:#f1f7ee}.icon{font-size:28px}.mode strong{display:block;font-size:18px}.mode small{color:#6a7971}.cover{width:100%;max-height:250px;object-fit:contain;border-radius:12px;background:#faf7ef;margin:16px 0}.player{width:100%;max-height:65vh;background:#111;border-radius:12px;display:block;margin:22px 0}audio.player{background:#f1f7ee;min-height:54px}.controls{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #b8d2c6;border-radius:12px;background:white;color:#176966;padding:11px 16px}button:hover{background:#eaf4ea}.note{font-size:13px;color:#68776c;margin-top:24px}.badge{display:inline-block;background:#edf4e9;border-radius:30px;padding:4px 12px;color:#32725b;font-size:13px;margin:8px 0}.status{font-size:14px;color:#536957;min-height:24px}footer{border-top:1px solid #dce5dc;margin-top:36px;padding-top:20px;font-size:12px;color:#758075}footer a{color:inherit}:focus-visible{outline:3px solid #e9ac28;outline-offset:4px}@media(max-width:540px){main{padding:26px 16px 40px}.cards{gap:12px}.card div{padding:14px}.card strong{font-size:18px}.card span{font-size:12px}.panel{padding:20px}.mode{padding:15px}.card small{font-size:11px}}
</style></head><body><main><header><div class="eyebrow">목포여자상업고등학교 · 글로벌 동화책</div><h1>파인애플의 전설</h1><p class="intro">한 편의 이야기, 네 가지 언어.<br>원어로 먼저 듣고, 이어서 한국어로 들어요.</p></header><section id="app" aria-live="polite"></section><footer>몽골어·스페인어·필리핀어는 원어민 낭독, 영어·한국어는 AI 음성입니다.<br>제작 지원 seojisub · <a href="https://blog.naver.com/seojisub">blog.naver.com/seojisub</a></footer></main>
<script>
const langs={tl:{name:'필리핀어',native:'Tagalog',title:'Ang Alamat ng Pinya',ko:70.083,note:'필리핀어 원어민 낭독은 현재 표지~5쪽 분량입니다. 이어서 한국어 전체 낭독이 재생됩니다.'},en:{name:'영어',native:'English',title:'The Legend of the Pineapple',ko:271.418,note:'영어와 한국어 낭독은 AI 음성입니다.'},mn:{name:'몽골어',native:'Монгол хэл',title:'Хан боргоцойны домог',ko:293.46,note:'몽골어 원어민 낭독에 이어 한국어 AI 낭독이 재생됩니다.'},es:{name:'스페인어',native:'Español',title:'La leyenda de la piña',ko:230.584,note:'스페인어 원어민 낭독에 이어 한국어 AI 낭독이 재생됩니다.'}};
const modes={book:{title:'책과 함께 듣기',desc:'책 장면이 낭독에 맞춰 넘어가요',icon:'📖',file:'book.mp4'},audio:{title:'소리만 듣기',desc:'종이책을 넘기며 들을 때 좋아요',icon:'🎧',file:'audio.mp3'},subtitles:{title:'자막과 함께 듣기',desc:'읽는 문장과 번역이 크게 나와요',icon:'💬',file:'subtitles.mp4'}};
function render(){document.querySelector('video,audio')?.pause();const [code,kind]=location.hash.slice(1).split('/');const l=langs[code];const app=document.getElementById('app');if(!l){app.innerHTML='<p>듣고 싶은 언어의 표지를 눌러 주세요.</p><div class="cards">'+Object.entries(langs).map(([c,v])=>`<a class="card" href="#${c}"><img src="${c}-cover.jpg" alt="${v.title} 책 표지"><div><strong>${v.name}</strong><span>${v.native} → 한국어</span><small>낭독 들으러 가기 →</small></div></a>`).join('')+'</div>';return}const m=modes[kind];if(!m){app.innerHTML=`<a class="back" href="#">← 언어 다시 고르기</a><div class="panel"><h2>${l.title}</h2><span class="badge">${l.native} → 한국어</span><img class="cover" src="${code}-cover.jpg" alt="${l.title} 책 표지"><p>어떻게 들을까요?</p><div class="modes">${Object.entries(modes).map(([k,v])=>`<a class="mode" href="#${code}/${k}"><span class="icon" aria-hidden="true">${v.icon}</span><span><strong>${v.title}</strong><small>${v.desc}</small></span></a>`).join('')}</div><p class="note">${l.note}</p></div>`;return}const tag=kind==='audio'?'audio':'video';app.innerHTML=`<a class="back" href="#${code}">← 듣는 방법 다시 고르기</a><div class="panel"><h2>${l.name} + 한국어</h2><span class="badge">${m.icon} ${m.title}</span><${tag} class="player" controls playsinline preload="metadata" ${tag==='video'?`poster="${code}-cover.jpg"`:''}><source src="${code}-${m.file}" type="${tag==='audio'?'audio/mpeg':'video/mp4'}">이 브라우저에서 재생할 수 없습니다.</${tag}><div class="controls"><button id="start">① ${l.name} 처음부터</button><button id="korean">② 한국어 낭독으로</button></div><p class="status" role="status">재생 버튼을 눌러 주세요.</p><p class="note">${l.note}</p><a href="${code}-${m.file}" target="_blank" rel="noopener">재생이 안 되면 원본 파일 열기 ↗</a></div>`;const media=app.querySelector(tag);const status=app.querySelector('.status');function seek(t){if(media.readyState){media.currentTime=t;media.play().catch(()=>status.textContent='재생 버튼을 눌러 주세요.')}else{media.addEventListener('loadedmetadata',()=>seek(t),{once:true});media.load()}}app.querySelector('#start').onclick=()=>seek(0);app.querySelector('#korean').onclick=()=>seek(l.ko);media.onplaying=()=>status.textContent='재생 중 · '+(media.currentTime>=l.ko?'한국어 낭독':l.name+' 낭독');media.ontimeupdate=()=>{if(!media.paused)status.textContent='재생 중 · '+(media.currentTime>=l.ko?'한국어 낭독':l.name+' 낭독')};media.onpause=()=>status.textContent='일시정지';media.onended=()=>status.textContent='이야기를 모두 들었어요.';media.onerror=()=>status.textContent='파일을 불러오지 못했어요. 아래 원본 파일 열기를 눌러 주세요.';}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
